name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nginx-app
  HADOLINT_VERSION: v2.12.0-alpine

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        run: shellcheck scripts/sysinfo.sh scripts/healthcheck.sh

      - name: Run hadolint
        run: docker run --rm -i "hadolint/hadolint:${HADOLINT_VERSION}" hadolint - < app/Dockerfile

  build:
    name: build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg "BUILD_SHA=${GITHUB_SHA}" --tag "${IMAGE_NAME}:${GITHUB_SHA}" app

      - name: Report image size
        run: |
          size="$(docker images "${IMAGE_NAME}:${GITHUB_SHA}" --format '{{.Size}}')"
          echo "image size is ${size}"

      - name: Export image
        run: docker save "${IMAGE_NAME}:${GITHUB_SHA}" --output image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: image.tar
          retention-days: 1

  test:
    name: test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: container-image

      - name: Load image
        run: docker load --input image.tar

      - name: Start container
        run: docker run --detach --name app --publish 8080:8080 "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:8080/healthz > /dev/null; then
              echo "ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "container never became ready"
          docker logs app
          exit 1

      - name: Health check on /healthz
        run: ./scripts/healthcheck.sh http://localhost:8080/healthz

      - name: Health check on /
        run: ./scripts/healthcheck.sh http://localhost:8080/

      - name: Verify build identifier is surfaced
        run: |
          actual="$(curl --silent --head http://localhost:8080/ \
            | tr -d '\r' \
            | awk 'tolower($1) == "x-build-sha:" { print $2 }')"
          if [ "$actual" != "$GITHUB_SHA" ]; then
            echo "expected X-Build-Sha ${GITHUB_SHA} but got '${actual}'"
            exit 1
          fi
          echo "X-Build-Sha matches ${GITHUB_SHA}"

      - name: Container logs
        if: always()
        run: docker logs app

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: container-image

      - name: Load image
        run: docker load --input image.tar

      - name: Resolve registry path
        id: target
        run: echo "repository=${REGISTRY}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin

      - name: Tag and push
        env:
          TARGET: ${{ steps.target.outputs.repository }}
        run: |
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${TARGET}:${GITHUB_SHA}"
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${TARGET}:latest"
          docker push "${TARGET}:${GITHUB_SHA}"
          docker push "${TARGET}:latest"
